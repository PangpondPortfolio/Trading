<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดบันทึกการเทรด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAFAF8;
    --panel: #FFFFFF;
    --panel-2: #F2F2EF;
    --border: #E1E1DC;
    --text: #1C1E1B;
    --muted: #767870;
    --muted-2: #A3A59C;
    --green: #1E9E6B;
    --green-dim: #E7F5EE;
    --green-solid: #1E9E6B;
    --red: #D6483F;
    --red-dim: #FCEBE9;
    --red-solid: #D6483F;
    --amber: #B8791A;
    --amber-dim: #FBF0DD;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Thai', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'IBM Plex Mono', monospace; }

  .app{
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* Header */
  header{
    display:flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 10px;
  }
  header h1{
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header h1 span{ color: var(--amber); }
  .currency-input{
    width: 48px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
  }
  .currency-input:focus{ outline: 1px solid var(--amber); border-color: var(--amber); }

  /* Tabs */
  .tabs{
    display:flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 18px;
    gap: 4px;
  }
  .tab-btn{
    flex:1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 9px 8px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn.active{
    background: var(--panel-2);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .tab-btn:not(.active):hover{ color: var(--text); }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---- Calendar view ---- */
  .month-bar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .nav-btn{
    width: 30px; height:30px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-btn:hover{ border-color: var(--amber); color: var(--amber); }
  .month-label{
    font-size: 15px;
    font-weight: 600;
    min-width: 130px;
    text-align: center;
  }
  .month-select, .year-select{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .month-select:focus, .year-select:focus{ outline: 1px solid var(--amber); border-color: var(--amber); }
  .year-select{ font-family: 'IBM Plex Mono', monospace; }
  .month-total{
    text-align: right;
  }
  .month-total .lbl{ font-size: 10.5px; color: var(--muted); display:block; margin-bottom: 2px;}
  .month-total .val{ font-size: 16px; font-weight: 600; }

  .weekday-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 5px;
  }
  .weekday-row div{
    text-align:center;
    font-size: 11px;
    color: var(--muted-2);
    padding-bottom: 4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-cell{
    min-height: 76px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 6px 8px;
    cursor: pointer;
    display:flex;
    flex-direction: column;
    transition: border-color .12s ease, transform .08s ease;
    position: relative;
  }
  .cal-cell:hover{ border-color: var(--muted-2); transform: translateY(-1px); }
  .cal-cell.empty{ background: transparent; border-color: transparent; cursor: default; }
  .cal-cell.adjacent{ background: transparent; border-color: transparent; cursor: default; opacity: 0.35; }
  .cal-cell.adjacent:hover{ transform: none; }
  .cal-cell.adjacent .cal-day-num{ color: var(--muted-2); }
  .cal-cell.today{ box-shadow: inset 0 0 0 1.5px var(--amber); }
  .cal-cell.pos, .cal-cell.neg{ background: var(--panel); border-color: var(--border); }
  .cal-day-num{
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    align-self: flex-start;
  }
  .cal-mid{
    flex: 1;
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2px;
  }
  .cal-total{
    font-size: 13.5px;
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.15;
  }
  .cal-total.pos{ color: var(--green); }
  .cal-total.neg{ color: var(--red); }
  .cal-count{
    font-size: 9.5px;
    color: var(--muted);
  }
  .cal-cell.pos .cal-count, .cal-cell.neg .cal-count{ color: var(--muted); }
  .cal-dot{
    position:absolute;
    top: 6px; right: 6px;
    width: 5px; height:5px;
    border-radius: 50%;
    background: var(--amber);
  }

  .legend{
    display:flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* Edit modal */
  .overlay{
    display:none;
    position: fixed; inset:0;
    background: rgba(5,7,10,0.6);
    align-items:flex-end;
    justify-content:center;
    z-index: 50;
    backdrop-filter: blur(2px);
  }
  .overlay.active{ display:flex; }
  .sheet{
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 720px;
    padding: 20px 18px 26px;
    animation: slideup .18s ease;
  }
  @keyframes slideup{ from{ transform: translateY(16px); opacity:0;} to{ transform: translateY(0); opacity:1;} }
  .sheet-title{
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .sheet-date{
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .field-label{ font-size: 12px; color: var(--muted); margin-bottom: 6px; display:block; }
  .amount-input{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 12px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .amount-input:focus{ outline:none; border-color: var(--amber); }
  .hint{
    font-size: 11.5px;
    color: var(--muted-2);
    margin: -8px 0 16px;
    line-height: 1.5;
  }
  .btn-row{ display:flex; gap: 8px; }
  .btn{
    flex:1;
    padding: 11px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn.primary{ background: var(--amber); border-color: var(--amber); color: #FFFFFF; font-weight: 600; }
  .btn.danger{ color: var(--red); }
  .btn:hover{ filter: brightness(1.08); }
  .btn.link{
    background: transparent;
    border: none;
    color: var(--amber);
    text-decoration: underline;
    flex: none;
    padding: 8px 0;
  }

  /* ---- Trade log view ---- */
  .date-picker-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .date-input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 10px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }
  .date-input:focus{ outline:none; border-color: var(--amber); }

  .note-wrap{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .note-header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .note-header .lbl{ font-size: 12.5px; color: var(--muted); }
  .note-status{ font-size: 11px; color: var(--muted-2); }
  .note-textarea{
    width: 100%;
    min-height: 360px;
    resize: vertical;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 14px;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .note-textarea:focus{ outline:none; border-color: var(--amber); }
  .note-textarea::placeholder{ color: var(--muted-2); }


  .toast{
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: all .2s ease;
    z-index: 100;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  ::selection{ background: var(--amber); color: #FFFFFF; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Trading <span>Tracking</span></h1>
    <input class="currency-input" id="currencyInput" maxlength="4" value="฿" title="สัญลักษณ์สกุลเงิน">
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-view="calendar">ปฏิทิน</button>
    <button class="tab-btn" data-view="log">โน้ตรายวัน</button>
  </div>

  <!-- CALENDAR VIEW -->
  <div class="view active" id="view-calendar">
    <div class="month-bar">
      <div class="month-nav">
        <button class="nav-btn" id="prevMonth">‹</button>
        <select class="month-select" id="monthSelect"></select>
        <select class="year-select" id="yearSelect"></select>
        <button class="nav-btn" id="nextMonth">›</button>
      </div>
      <div class="month-total">
        <span class="lbl">รวมเดือนนี้</span>
        <span class="val mono" id="monthTotalVal">-</span>
      </div>
    </div>
    <div class="weekday-row">
      <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>กำไร</span>
      <span><i style="background:var(--red)"></i>ขาดทุน</span>
      <span><i style="background:var(--amber)"></i>มีโน้ตของวันนี้</span>
    </div>
  </div>

  <!-- DAILY NOTE VIEW -->
  <div class="view" id="view-log">
    <div class="date-picker-row">
      <input type="date" class="date-input" id="logDate">
    </div>

    <div class="note-wrap">
      <div class="note-header">
        <span class="lbl">โน้ตของวันนี้</span>
        <span class="note-status" id="noteStatus"></span>
      </div>
      <textarea class="note-textarea" id="noteTextarea" placeholder="พิมพ์บันทึกของวันนี้ได้เลย เช่น สิ่งที่เทรดได้ดี ข้อผิดพลาดที่ต้องแก้ อารมณ์ระหว่างเทรด ฯลฯ"></textarea>
    </div>
  </div>
</div>

<!-- Edit day sheet (calendar quick edit) -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <div class="sheet-title">แก้ไขยอดรวมของวัน</div>
    <div class="sheet-date" id="editDateLabel">-</div>
    <span class="field-label">กำไร / ขาดทุน (ใส่เครื่องหมาย - หน้าตัวเลขถ้าขาดทุน)</span>
    <input class="amount-input" id="editAmountInput" type="text" inputmode="decimal" placeholder="0.00">
    <div class="hint" id="editHint">พิมพ์ยอดกำไรหรือขาดทุนรวมของวันนี้</div>
    <div class="btn-row">
      <button class="btn danger" id="editDeleteBtn">ลบยอด</button>
      <button class="btn primary" id="editSaveBtn">บันทึก</button>
    </div>
    <button class="btn link" id="editGoLogBtn">→ ไปเขียนโน้ตของวันนี้</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const pad2 = n => String(n).padStart(2,'0');
  function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function monthKeyOf(y,m){ return y+'-'+pad2(m+1); }

  const state = {
    view: 'calendar',
    curYear: new Date().getFullYear(),
    curMonth: new Date().getMonth(), // 0-based
    monthData: {},   // {"01": {total, hasTrades}, ...}
    editingDate: null,
    logDate: fmtDate(new Date()),
    currency: '฿'
  };

  function fmtMoney(n){
    const abs = Math.abs(n);
    const s = abs.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    return (n < 0 ? '−' : (n > 0 ? '+' : '')) + state.currency + s;
  }
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 1800);
  }

  // ---------- storage helpers ----------
  async function storageGet(key){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, value){
    try{
      const r = await window.storage.set(key, value, false);
      return !!r;
    }catch(e){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return false; }
  }

  async function loadSettings(){
    const c = await storageGet('settings:currency');
    if(c) { state.currency = c; document.getElementById('currencyInput').value = c; }
  }
  document.getElementById('currencyInput').addEventListener('change', async (e)=>{
    const v = e.target.value.trim() || '฿';
    state.currency = v;
    await storageSet('settings:currency', v);
    renderCalendar();
    renderLog();
  });

  // ---------- month data ----------
  async function loadMonth(y,m){
    const key = 'month:'+monthKeyOf(y,m);
    const raw = await storageGet(key);
    let data = {};
    if(raw){ try{ data = JSON.parse(raw); }catch(e){ data = {}; } }
    state.monthData = data;

    const noteKey = 'noteidx:'+monthKeyOf(y,m);
    const noteRaw = await storageGet(noteKey);
    let noteData = {};
    if(noteRaw){ try{ noteData = JSON.parse(noteRaw); }catch(e){ noteData = {}; } }
    state.noteIndex = noteData;
  }
  async function saveMonth(y,m){
    const key = 'month:'+monthKeyOf(y,m);
    return await storageSet(key, JSON.stringify(state.monthData));
  }

  const monthNamesTh = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  function populateMonthYearSelects(){
    const monthSel = document.getElementById('monthSelect');
    monthSel.innerHTML = '';
    monthNamesTh.forEach((name, i)=>{
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = name;
      monthSel.appendChild(opt);
    });
    const yearSel = document.getElementById('yearSelect');
    yearSel.innerHTML = '';
    const nowY = new Date().getFullYear();
    for(let y = nowY - 8; y <= nowY + 4; y++){
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = (y + 543);
      yearSel.appendChild(opt);
    }
  }
  populateMonthYearSelects();
  document.getElementById('monthSelect').addEventListener('change', (e)=>{
    state.curMonth = parseInt(e.target.value, 10);
    renderCalendar();
  });
  document.getElementById('yearSelect').addEventListener('change', (e)=>{
    state.curYear = parseInt(e.target.value, 10);
    renderCalendar();
  });

  async function renderCalendar(){
    await loadMonth(state.curYear, state.curMonth);
    drawCalendarGrid();
  }
  function drawCalendarGrid(){
    document.getElementById('monthSelect').value = state.curMonth;
    document.getElementById('yearSelect').value = state.curYear;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const firstDay = new Date(state.curYear, state.curMonth, 1).getDay();
    const daysInMonth = new Date(state.curYear, state.curMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(state.curYear, state.curMonth, 0).getDate();
    const todayStr = fmtDate(new Date());
    const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
    const trailing = totalCells - firstDay - daysInMonth;

    let monthTotal = 0;
    let hasAny = false;

    // leading days from previous month (muted, not clickable)
    for(let i=0; i<firstDay; i++){
      const dNum = daysInPrevMonth - firstDay + i + 1;
      const cell = document.createElement('div');
      cell.className = 'cal-cell adjacent';
      const numDiv = document.createElement('div');
      numDiv.className = 'cal-day-num';
      numDiv.textContent = dNum;
      cell.appendChild(numDiv);
      grid.appendChild(cell);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dayKey = pad2(d);
      const entry = state.monthData[dayKey];
      const cell = document.createElement('div');
      const dateStr = state.curYear+'-'+pad2(state.curMonth+1)+'-'+dayKey;
      cell.className = 'cal-cell';
      if(dateStr === todayStr) cell.classList.add('today');

      const numDiv = document.createElement('div');
      numDiv.className = 'cal-day-num';
      numDiv.textContent = d;
      cell.appendChild(numDiv);

      if(entry && typeof entry.total === 'number'){
        hasAny = true;
        monthTotal += entry.total;
        const cls = entry.total >= 0 ? 'pos' : 'neg';
        cell.classList.add(cls);

        const mid = document.createElement('div');
        mid.className = 'cal-mid';
        const totalDiv = document.createElement('div');
        totalDiv.className = 'cal-total ' + cls;
        totalDiv.textContent = fmtMoney(entry.total);
        mid.appendChild(totalDiv);
        cell.appendChild(mid);
      }
      if(state.noteIndex && state.noteIndex[dayKey]){
        const dot = document.createElement('div');
        dot.className = 'cal-dot';
        cell.appendChild(dot);
      }
      cell.addEventListener('click', ()=> openEditSheet(dateStr));
      grid.appendChild(cell);
    }
    // trailing days from next month (muted, not clickable)
    for(let d=1; d<=trailing; d++){
      const cell = document.createElement('div');
      cell.className = 'cal-cell adjacent';
      const numDiv = document.createElement('div');
      numDiv.className = 'cal-day-num';
      numDiv.textContent = d;
      cell.appendChild(numDiv);
      grid.appendChild(cell);
    }

    const mtEl = document.getElementById('monthTotalVal');
    mtEl.textContent = hasAny ? fmtMoney(monthTotal) : '—';
    mtEl.style.color = !hasAny ? 'var(--muted)' : (monthTotal >= 0 ? 'var(--green)' : 'var(--red)');
  }

  document.getElementById('prevMonth').addEventListener('click', ()=>{
    state.curMonth--;
    if(state.curMonth < 0){ state.curMonth = 11; state.curYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    state.curMonth++;
    if(state.curMonth > 11){ state.curMonth = 0; state.curYear++; }
    renderCalendar();
  });

  // ---------- edit sheet ----------
  function openEditSheet(dateStr){
    state.editingDate = dateStr;
    const d = new Date(dateStr+'T00:00:00');
    document.getElementById('editDateLabel').textContent =
      d.getDate() + ' ' + monthNamesTh[d.getMonth()] + ' ' + (d.getFullYear()+543);
    const dayKey = pad2(d.getDate());
    const entry = state.monthData[dayKey];
    const input = document.getElementById('editAmountInput');
    input.value = (entry && typeof entry.total === 'number') ? entry.total : '';
    const hint = document.getElementById('editHint');
    hint.textContent = 'พิมพ์ยอดกำไรหรือขาดทุนรวมของวันนี้';
    document.getElementById('editOverlay').classList.add('active');
    setTimeout(()=>{ input.focus(); input.select(); }, 60);
  }
  function closeEditSheet(){
    document.getElementById('editOverlay').classList.remove('active');
    state.editingDate = null;
  }
  document.getElementById('editOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'editOverlay') closeEditSheet();
  });
  document.getElementById('editAmountInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('editSaveBtn').click();
  });
  // Read-modify-write a single day's entry into its OWN month's storage record.
  // Always targets the month derived from the edited date (not whatever month
  // happens to be on screen when the save actually completes), and always
  // re-fetches the latest saved data right before writing so that quickly
  // switching months in between doesn't clobber other days' data or land the
  // entry in the wrong month.
  async function saveEntryToMonth(y, m, dayKey, entryOrNull){
    const key = 'month:'+monthKeyOf(y,m);
    const raw = await storageGet(key);
    let data = {};
    if(raw){ try{ data = JSON.parse(raw); }catch(e){ data = {}; } }
    if(entryOrNull === null){ delete data[dayKey]; } else { data[dayKey] = entryOrNull; }
    const ok = await storageSet(key, JSON.stringify(data));
    if(ok && y === state.curYear && m === state.curMonth){
      // still viewing that month: sync in-memory state + redraw with the
      // authoritative saved data
      state.monthData = data;
      drawCalendarGrid();
    }
    return ok;
  }

  document.getElementById('editSaveBtn').addEventListener('click', async ()=>{
    if(!state.editingDate) return;
    const raw = document.getElementById('editAmountInput').value;
    const cleaned = raw.replace(/[,\s]/g, '').replace(/[^\d.\-+]/g, '');
    if(cleaned === '' || cleaned === '-' || cleaned === '+'){ showToast('พิมพ์ตัวเลขก่อนบันทึก'); return; }
    const num = parseFloat(cleaned);
    if(isNaN(num)){ showToast('ตัวเลขไม่ถูกต้อง ลองใหม่อีกครั้ง'); return; }
    const editDateStr = state.editingDate;
    const d = new Date(editDateStr+'T00:00:00');
    const targetY = d.getFullYear(), targetM = d.getMonth();
    const dayKey = pad2(d.getDate());

    // optimistic UI update, only if the edited day belongs to the month
    // currently on screen
    if(targetY === state.curYear && targetM === state.curMonth){
      state.monthData[dayKey] = { total: num };
      drawCalendarGrid();
    }
    closeEditSheet();

    const ok = await saveEntryToMonth(targetY, targetM, dayKey, { total: num });
    if(ok) showToast('บันทึกแล้ว');
  });
  document.getElementById('editDeleteBtn').addEventListener('click', async ()=>{
    if(!state.editingDate) return;
    const editDateStr = state.editingDate;
    const d = new Date(editDateStr+'T00:00:00');
    const targetY = d.getFullYear(), targetM = d.getMonth();
    const dayKey = pad2(d.getDate());

    if(targetY === state.curYear && targetM === state.curMonth){
      delete state.monthData[dayKey];
      drawCalendarGrid();
    }
    closeEditSheet();

    const ok = await saveEntryToMonth(targetY, targetM, dayKey, null);
    if(ok) showToast('ลบยอดแล้ว');
  });
  document.getElementById('editGoLogBtn').addEventListener('click', ()=>{
    if(!state.editingDate) return;
    document.getElementById('logDate').value = state.editingDate;
    state.logDate = state.editingDate;
    closeEditSheet();
    switchView('log');
    renderNote();
  });

  // ---------- tabs ----------
  function switchView(view){
    state.view = view;
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.view === view));
    document.getElementById('view-calendar').classList.toggle('active', view==='calendar');
    document.getElementById('view-log').classList.toggle('active', view==='log');
    if(view === 'calendar') renderCalendar();
    if(view === 'log') renderNote();
  }
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=> switchView(b.dataset.view));
  });

  // ---------- daily note view ----------
  const dateInput = document.getElementById('logDate');
  dateInput.value = state.logDate;
  dateInput.addEventListener('change', ()=>{
    state.logDate = dateInput.value || fmtDate(new Date());
    renderNote();
  });

  async function loadNote(dateStr){
    const raw = await storageGet('note:'+dateStr);
    return raw || '';
  }

  async function setNoteIndexFlag(dateStr, hasNote){
    const d = new Date(dateStr+'T00:00:00');
    const y = d.getFullYear(), m = d.getMonth();
    const key = 'noteidx:'+monthKeyOf(y,m);
    let idx = {};
    const raw = await storageGet(key);
    if(raw){ try{ idx = JSON.parse(raw); }catch(e){ idx = {}; } }
    const dayKey = pad2(d.getDate());
    if(hasNote){ idx[dayKey] = true; } else { delete idx[dayKey]; }
    await storageSet(key, JSON.stringify(idx));
    if(y === state.curYear && m === state.curMonth){ state.noteIndex = idx; }
  }

  async function saveNote(dateStr, text){
    if(text.trim() === ''){
      await storageSet('note:'+dateStr, '');
    } else {
      await storageSet('note:'+dateStr, text);
    }
    await setNoteIndexFlag(dateStr, text.trim() !== '');
  }

  function formatDateLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return d.getDate() + ' ' + monthNamesTh[d.getMonth()] + ' ' + (d.getFullYear()+543);
  }

  const noteTextarea = document.getElementById('noteTextarea');
  const noteStatus = document.getElementById('noteStatus');
  let noteSaveTimer = null;

  async function renderNote(){
    const dateStr = state.logDate;
    const text = await loadNote(dateStr);
    noteTextarea.value = text;
    noteStatus.textContent = formatDateLabel(dateStr);
  }

  noteTextarea.addEventListener('input', ()=>{
    noteStatus.textContent = 'กำลังพิมพ์…';
    clearTimeout(noteSaveTimer);
    noteSaveTimer = setTimeout(async ()=>{
      const dateStr = state.logDate;
      await saveNote(dateStr, noteTextarea.value);
      noteStatus.textContent = 'บันทึกแล้ว · ' + formatDateLabel(dateStr);
    }, 500);
  });
  noteTextarea.addEventListener('blur', async ()=>{
    clearTimeout(noteSaveTimer);
    const dateStr = state.logDate;
    await saveNote(dateStr, noteTextarea.value);
    noteStatus.textContent = 'บันทึกแล้ว · ' + formatDateLabel(dateStr);
  });

  // ---------- init ----------
  (async function init(){
    await loadSettings();
    await renderCalendar();
  })();
})();
</script>
</body>
</html>
